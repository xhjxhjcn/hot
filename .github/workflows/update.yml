name: Update hot list

on:
  # 主触发入口：ECS 115.29.227.163 的 crontab 每 30 分钟调一次 workflow_dispatch
  # API（脚本 /opt/xhj-hot-dispatch/dispatch_hot.py）。原因见 README「更新频率」。
  workflow_dispatch:

  # 兜底：GitHub 对低活跃仓库的 schedule 会严重降级（2026-10 实测平均约 7 小时
  # 才跑一次，仅为声明频率的 ~7%），故仅作容灾保留。
  schedule:
    - cron: '5,35 * * * *'

permissions:
  contents: write

concurrency:
  group: update-hot
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch hot list
        run: python scripts/fetch_hot.py

      - name: Report result
        run: |
          python - <<'PY'
          import json
          d = json.load(open('data/hot.json', encoding='utf-8'))
          print(f"updated={d['updated']}  ok={d['ok']}/{d['total']}")
          for s in d['sources']:
              if not s['ok']:
                  print(f"  !! {s['key']}: {s['error']}")
          PY

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hot.json data/archive
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新热榜数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # 主动把 URL 推给 Bing（IndexNow），不必等爬虫自己找过来。
      # 密钥与 topic 列表都从 scripts/prerender.js 里读，避免两处写死不同步。
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          # 等 Pages 构建完成再推，否则 Bing 可能抓到尚未上线的 URL
          sleep 150
          echo "INDEXNOW_KEY=$(grep -oP "INDEXNOW_KEY = '\K[^']+" scripts/prerender.js)" >> "$GITHUB_ENV"
          echo "TOPIC_SLUGS=$(grep -oP "slug: '\K[a-z]+" scripts/prerender.js | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Submit to IndexNow
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os, urllib.request

          key = os.environ['INDEXNOW_KEY']
          site = 'https://hot.xhja.cn'
          data = json.load(open('data/hot.json', encoding='utf-8'))

          urls = [f'{site}/', f'{site}/all-hot.html', f'{site}/boards.html', f'{site}/guide.html', f'{site}/today/']
          urls += [f"{site}/board/{s['key']}.html" for s in data['sources']]
          urls += [f'{site}/topic/{s}.html' for s in os.environ['TOPIC_SLUGS'].split() if s]

          payload = json.dumps({
              'host': 'hot.xhja.cn',
              'key': key,
              'keyLocation': f'{site}/{key}.txt',
              'urlList': urls,
          }).encode('utf-8')

          req = urllib.request.Request(
              'https://api.indexnow.org/indexnow', data=payload,
              headers={'Content-Type': 'application/json; charset=utf-8'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f'IndexNow 已提交 {len(urls)} 个 URL -> HTTP {r.status}')
          except Exception as e:
              print(f'IndexNow 提交失败（不影响数据更新）: {e}')
          PY
