name: Update hot list

on:
  # 主触发入口：ECS 115.29.227.163 的 crontab 每 30 分钟调一次 workflow_dispatch
  # API（脚本 /opt/xhj-hot-dispatch/dispatch_hot.py）。原因见 README「更新频率」。
  workflow_dispatch:

  # 兜底：GitHub 对低活跃仓库的 schedule 会严重降级（2026-10 实测平均约 7 小时
  # 才跑一次，仅为声明频率的 ~7%），故仅作容灾保留。
  schedule:
    - cron: '5,35 * * * *'

permissions:
  contents: write

concurrency:
  group: update-hot
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch hot list
        run: python scripts/fetch_hot.py

      - name: Report result
        run: |
          python - <<'PY'
          import json
          d = json.load(open('data/hot.json', encoding='utf-8'))
          print(f"updated={d['updated']}  ok={d['ok']}/{d['total']}")
          for s in d['sources']:
              if not s['ok']:
                  print(f"  !! {s['key']}: {s['error']}")
          PY

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hot.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新热榜数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
