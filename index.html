                      action="https://www.baidu.com/s" target="_blank" rel="noopener noreferrer"
                      aria-label="全网搜索">
                    <span class="search-icon" aria-hidden="true">

                    </span>
                    <input type="text" name="wd" id="search-input" placeholder="搜索全网热点…" autocomplete="off" aria-label="搜索全网热点">
                    <select id="search-engine" class="se-select" aria-label="切换搜索引擎" title="切换搜索引擎">

                        <option value="bing">必应</option>
                        <option value="google">谷歌</option>

                    <button type="submit" class="se-btn">搜索</button>
