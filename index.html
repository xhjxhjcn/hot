<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>今日热榜 - 汇聚全网热点，热门尽览无余</title>
    <meta name="description" content="行恒简安 · 今日热榜：聚合百度、微博、抖音、知乎、哔哩哔哩、今日头条、GitHub 等各大平台实时热点，一屏纵览全网头条。">
    <meta name="theme-color" content="#eaf1fb">
    <link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="assets/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <canvas id="tech-canvas" aria-hidden="true"></canvas>

    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="https://www.xhja.cn" aria-label="门户主页">
                <img src="assets/logo.png" alt="行恒简安" class="brand-logo">
                <div class="brand-text">
                    <span class="brand-name">今日热榜</span>
                    <span class="brand-slogan">汇聚全网热点 · 热门尽览无余</span>
                </div>
            </a>

            <div class="header-actions">
                <div id="datetime" class="clock">
                    <div class="clock-main">
                        <span class="clock-hm" id="clockHM">--:--</span>
                        <span class="clock-sec" id="clockSec">--</span>
                    </div>
                    <span class="clock-divider" aria-hidden="true"></span>
                    <div class="clock-meta">
                        <span class="clock-ymd" id="clockYmd">----/--/--</span>
                        <span class="clock-lunar" id="clockLunar"></span>
                    </div>
                </div>
                <button id="dark-toggle" class="icon-btn" title="切换主题" aria-label="切换主题">🌙</button>
                <button id="refresh-all" class="btn-ghost-sm" title="重新抓取并刷新全部榜单">
                    <span class="spin-icon" aria-hidden="true">⟳</span><span class="btn-label">刷新</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <!-- 概览 + 搜索 -->
        <section class="overview">
            <div class="overview-head">
                <span class="section-tag">TRENDING NOW</span>
                <h1>全网热点，一屏纵览</h1>
                <p id="overviewSub">正在加载各平台榜单…</p>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <span class="search-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
                        </svg>
                    </span>
                    <input type="text" id="search-input" placeholder="搜索平台或热点关键词…" autocomplete="off" aria-label="搜索">
                    <button type="button" id="search-clear" class="search-clear" hidden aria-label="清空">×</button>
                </div>

                <div class="seg" role="tablist" id="kind-tabs">
                    <button type="button" class="seg-item active" data-kind="all">全部</button>
                    <button type="button" class="seg-item" data-kind="rank">榜单</button>
                    <button type="button" class="seg-item" data-kind="news">资讯</button>
                    <button type="button" class="seg-item" data-kind="community">社区</button>
                </div>

                <div class="toolbar-meta">
                    <span class="dot" id="statusDot"></span>
                    <span id="dataTime">--</span>
                </div>
            </div>
        </section>

        <!-- 卡片网格 -->
        <section class="grid-wrap">
            <div class="hot-grid" id="hotGrid"></div>
            <div class="empty-state" id="emptyState" hidden>
                <div class="empty-icon">🔍</div>
                <p>没有匹配的榜单，请更换关键词</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <img src="assets/logo.png" alt="" class="footer-logo">
                <div>
                    <div class="footer-name">行恒简安</div>
                    <div class="footer-slogan">行恒致远 · 简安自得</div>
                </div>
            </div>
            <div class="footer-links" id="footerLinks"></div>
            <div class="footer-beian" id="footerBeian" hidden></div>
            <div class="xhja-mail"><a href="mailto:x@xhja.cn">📧 联系我：x@xhja.cn</a></div>
            <div class="footer-copy">
                © <span id="year">2026</span> 行恒简安
            </div>
        </div>
    </footer>

    <button id="scroll-top" title="回到顶部" aria-label="回到顶部">↑</button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- 榜单详情弹窗：点卡片「查看全部」时在本页弹出，不跳页 -->
    <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <span class="modal-accent" aria-hidden="true"></span>

            <header class="modal-head">
                <img class="modal-icon" id="modalIcon" src="" alt="">
                <div class="modal-head-text">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <p class="modal-meta">
                        <span class="modal-badge" id="modalBadge" hidden></span>
                        <span id="modalCount"></span>
                    </p>
                </div>
                <button type="button" class="modal-close" id="modalClose" title="关闭（Esc）" aria-label="关闭弹窗">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                         stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18"/>
                    </svg>
                </button>
            </header>

            <div class="modal-body" id="modalBody"></div>

            <footer class="modal-foot">
                <span class="modal-time" id="modalTime"></span>
                <div class="modal-actions">
                    <button type="button" class="modal-act" id="modalRefresh">
                        <span class="spin-icon" aria-hidden="true">⟳</span><span>刷新</span>
                    </button>
                    <a class="modal-act is-primary" id="modalLink" href="#" target="_blank" rel="noopener noreferrer">
                        前往官网<span class="modal-act-arrow" aria-hidden="true">↗</span>
                    </a>
                </div>
            </footer>
        </div>
    </div>

    <script src="assets/lunar-data.js"></script>
    <script src="assets/lunar.js"></script>
    <script src="assets/app.js" defer></script>
    <script defer src="https://api.xhja.cn/stats.js?site=hot"></script>
</body>
</html>
