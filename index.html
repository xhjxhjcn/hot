<body>
    <a class="skip-link" href="#hotGrid">跳到热榜内容</a>

    <header class="site-header" id="siteHeader">
        <div class="header-inner">
            <a class="brand" href="https://www.xhja.cn" aria-label="返回行恒简安门户主页">
                <img src="assets/logo.png" alt="" class="brand-logo" width="28" height="28">
                <span class="brand-name">今日热榜</span>
            </a>

            <nav class="top-nav" aria-label="站点导航">
                <a href="/boards">全部榜单</a>
                <a href="/all-hot">全网总榜</a>
                <a href="/guide">使用指南</a>
            </nav>

            <div class="header-actions">
                <div id="datetime" class="clock" title="当前时间">
                    <span class="clock-hm" id="clockHM">--:--</span>
                    <span class="clock-sec" id="clockSec">--</span>
                    <span class="clock-ymd" id="clockYmd"></span>
                    <span class="clock-lunar" id="clockLunar"></span>
                </div>
                <!-- 只刷新「读取」：带 ?t= 绕缓存重新拉 data/hot.json。
                     抓取由 GitHub Actions 每 30 分钟跑，静态站没有后端抓取能力。 -->
                <button id="refresh-all" class="btn-refresh" type="button" title="重新加载最新数据（绕过缓存）">
                    <span class="spin-icon" aria-hidden="true">⟳</span><span class="btn-label">刷新</span>
                </button>
                <button id="dark-toggle" class="icon-btn" type="button" title="切换深浅色" aria-label="切换深浅色主题">🌙</button>
            </div>
        </div>
        <div class="loadbar" id="loadbar" hidden><span></span></div>
    </header>

    <main>
        <!-- 标题 + 数据概览 -->
        <section class="hero">
            <div class="hero-text">
                <h1>今日热榜</h1>
                <p class="hero-sub">全网热点，一屏纵览。聚合各平台公开榜单，每 30 分钟自动更新。</p>
            </div>
            <dl class="stats" id="heroStats">
                <div class="stat">
                    <dt>平台</dt>
                    <dd><span id="statPlatforms">--</span></dd>
                </div>
                <div class="stat">
                    <dt>热点条目</dt>
                    <dd><span id="statItems">--</span></dd>
                </div>
                <div class="stat">
                    <dt>数据更新</dt>
                    <dd><span id="statUpdated">--</span></dd>
                </div>
            </dl>
        </section>

        <!-- 搜索 -->
        <section class="toolbar">
            <form class="search-box" id="siteSearch" role="search" method="get"
                  action="https://www.baidu.com/s" target="_blank" rel="noopener noreferrer"
                  aria-label="搜索热点">
                <span class="search-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
                    </svg>
                </span>
                <input type="text" name="wd" id="search-input" placeholder="输入关键词，即时筛选本页热点…" autocomplete="off"
                       aria-label="输入关键词筛选本页热点，回车搜索全网" spellcheck="false">
                <button type="button" class="search-clear" id="searchClear" hidden aria-label="清空关键词" title="清空（Esc）">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18"/>
                    </svg>
                </button>
                <select id="search-engine" class="se-select" aria-label="选择搜索引擎" title="回车搜索全网时用哪个引擎">
                    <option value="baidu" selected>百度</option>
                    <option value="bing">必应</option>
                    <option value="google">谷歌</option>
                </select>
                <button type="submit" class="se-btn">搜全网</button>
            </form>

            <div class="toolbar-meta">
                <span class="dot" id="statusDot" title="数据状态"></span>
                <span id="dataTime">--</span>
            </div>
        </section>

        <!-- 分类筛选 + 平台快速导航（滚动后吸顶，不遮挡内容） -->
        <div class="filters" id="filters">
            <div class="filter-row">
                <div class="chip-row chip-row-cat" id="catChips" role="group" aria-label="按分类筛选"></div>
                <button type="button" class="src-toggle" id="srcToggle" aria-expanded="false" aria-controls="srcPanel" hidden>
                    平台<span class="src-toggle-caret" aria-hidden="true">▾</span>
                </button>
            </div>
            <div class="filter-row filter-row-src">
                <div class="chip-row chip-row-src" id="srcChips" role="group" aria-label="平台快速导航"></div>
                <a class="src-more" href="/boards">全部平台 →</a>
            </div>
            <div class="src-panel" id="srcPanel" hidden></div>
        </div>

        <p class="filter-status" id="filterStatus" hidden></p>

        <!-- 卡片网格 -->
        <section class="grid-wrap" aria-label="各平台热榜">
            <div class="hot-grid" id="hotGrid"></div>
        </section>

        <!-- 全部榜单导航（内链枢纽，构建期由 scripts/prerender.js 填充） -->
        <section class="boards-foot">
            <h2 class="foot-title">全部平台热榜</h2>
            <nav class="board-nav" id="boardNav" hidden aria-label="全部榜单导航"></nav>
            <p class="foot-note">今日热榜聚合的均为各平台公开榜单，本站只做抓取、合并与索引，点击任一条目跳转至原平台页面。</p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-top">
                <div class="footer-brand">
                    <img src="assets/logo.png" alt="" class="footer-logo" loading="lazy">
                    <div>
                        <div class="footer-name">行恒简安</div>
                        <div class="footer-slogan">行恒致远 · 简安自得</div>
                    </div>
                </div>
                <p class="footer-about">
                    数据每 30 分钟自动更新一次，来自微博、百度、抖音、知乎等平台的公开榜单接口；
                    本站仅做聚合与索引，标题、热度与链接版权归原平台所有。
                </p>
            </div>

            <!-- 分组平台索引（构建期预渲染，app.js 加载后会重绘同样内容） -->
            <div class="footer-groups" id="footerLinks"></div>

            <div class="footer-bottom">
                <div class="footer-beian" id="footerBeian" hidden></div>
                <div class="xhja-mail"><a href="mailto:x@xhja.cn">联系我：x@xhja.cn</a></div>
                <div class="footer-copy">© <span id="year">2026</span> 行恒简安</div>
            </div>
        </div>
    </footer>

    <button id="scroll-top" title="回到顶部" aria-label="回到顶部" type="button">↑</button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- 榜单详情弹窗：点卡片「查看全部」时在本页弹出，不跳页 -->
    <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <header class="modal-head">
                <img class="modal-icon" id="modalIcon" src="" alt="">
                <div class="modal-head-text">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <p class="modal-meta">
                        <span class="modal-badge" id="modalBadge" hidden></span>
                        <span id="modalCount"></span>
                    </p>
                </div>
                <button type="button" class="modal-close" id="modalClose" title="关闭（Esc）" aria-label="关闭弹窗">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                         stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18"/>
                    </svg>
                </button>
            </header>

            <div class="modal-body" id="modalBody"></div>

            <footer class="modal-foot">
                <span class="modal-time" id="modalTime"></span>
                <div class="modal-actions">
                    <a class="modal-act is-primary" id="modalLink" href="#" target="_blank" rel="noopener noreferrer">
                        前往官网<span class="modal-act-arrow" aria-hidden="true">↗</span>
                    </a>
                </div>
            </footer>
        </div>
    </div>

    <script src="assets/lunar-data.js"></script>
    <script src="assets/lunar.js"></script>
    <script src="assets/app.js" defer></script>
    <script defer src="https://api.xhja.cn/stats.js?site=hot"></script>
